

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>М*</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href=".." class="logo-link">М*</a>
    <a href="../donate" class="header-btn donate-btn">ПОДДЕРЖАТЬ</a>
</header>

<main id="main-container">
    <div class="news-feed" id="news-feed"></div>
</main>

<footer>18+. МАТЕРИАЛ СОЗДАН ДЛЯ ПУБЛИЧНОГО ИСПОЛЬЗОВАНИЯ</footer>

<script>
    const DB_URL = 'https://upheld-chalice-468113-k6-default-rtdb.europe-west1.firebasedatabase.app/articles.json';

    async function loadNews() {
        const newsFeed = document.getElementById('news-feed');
        try {
            const response = await fetch(DB_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            
            // Превращаем объект из Firebase в массив
            let articles = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];

            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (articleId && data[articleId]) {
                const a = data[articleId];
                newsFeed.innerHTML = `
                    <article style="border-bottom:none">
                        <div class="article-date">${a.date}</div>
                        <h1 class="news-title" style="font-size:3.5rem">${a.title}</h1>
                        <p class="news-text full-text">${a.fullText}</p>
                        <a href=".." class="back-link">← НАЗАД</a>
                    </article>`;
                return;
            }

            // Новые сверху, лимит 5
            articles.reverse();
            const latest = articles.slice(0, 5);

            // Отображаем статьи на странице
            if (latest.length === 0) {
                newsFeed.innerHTML = '<p style="text-align: center; padding: 40px;">Статьи отсутствуют</p>';
            } else {
                newsFeed.innerHTML = latest.map(article => `
                    <a href="?id=${article.id}" class="article-link">
                        <article class="feed-item">
                            <div class="article-date">${article.date}</div>
                            <h2 class="news-title">${article.title}</h2>
                            <p class="news-text">${article.shortDesc}</p>
                        </article>
                    </a>
                `).join('');
            }

        } catch (e) {
            console.error('Database error:', e);
            newsFeed.innerHTML = '<p style="text-align: center; padding: 40px; color: red;">Ошибка подключения к базе данных.</p>';
        }
    }
    loadNews();
</script>
</body>
</html>
