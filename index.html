

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>М*</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href=".." class="logo-link">М*</a>
    <a href="../donate" class="header-btn donate-btn">ПОДДЕРЖАТЬ</a>
</header>

<main id="main-container">
    <div class="news-feed" id="news-feed"></div>
</main>

<footer>18+. МАТЕРИАЛ СОЗДАН ДЛЯ ПУБЛИЧНОГО ИСПОЛЬЗОВАНИЯ</footer>

<script>
    const DB_URL = 'https://upheld-chalice-468113-k6-default-rtdb.europe-west1.firebasedatabase.app/articles';

    async function loadNews() {
        const newsFeed = document.getElementById('news-feed');
        try {
            const response = await fetch(DB_URL);
            const data = await response.json();
            
            // Превращаем объект из Firebase в массив
            let articles = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];

            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            if (articleId && data[articleId]) {
                const a = data[articleId];
                newsFeed.innerHTML = `
                    <article style="border-bottom:none">
                        <div class="article-date">${a.date}</div>
                        <h1 class="news-title" style="font-size:3.5rem">${a.title}</h1>
                        <p class="news-text full-text">${a.fullText}</p>
                        <a href=".." class="back-link">← НАЗАД</a>
                    </article>`;
                return;
            }

            // Новые сверху, лимит 5
            articles.reverse();
            const latest = articles.slice(0, 5);

        } catch (e) {
            newsFeed.innerHTML = 'Ошибка подключения к базе данных.';
        }
    }
    loadNews();
</script>
</body>
</html>
