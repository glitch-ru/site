<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Донаты</title>

  <style>
    body{
      margin:0;
      background:#252729;
      display:flex;

<div class="donateCard">

  <div class="DonationCard-module--Wrapper--5843f">

    <div class="DonationCard-module--TitleContainer--39c25">

</html>
