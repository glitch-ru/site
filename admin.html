<!-- admin.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ панель</title>

  <style>
    body{
      margin:0;
      background:#252729;
      color:white;
      font-family:Arial;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:40px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
    }

    input, textarea{
      width:100%;
      padding:15px;
      margin-bottom:20px;
      border:none;
      border-radius:15px;
      font-size:16px;
      box-sizing:border-box;
    }

    textarea{
      min-height:200px;
      resize:vertical;
    }

    button{
      width:100%;
      padding:16px;
      border:none;
      border-radius:999px;
      background:#994146;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    .success{
      margin-top:20px;
      text-align:center;
      color:lightgreen;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Админ панель</h1>

  <input id="title" placeholder="Заголовок">

  <input id="shortDesc" placeholder="Краткое описание">

  <textarea id="fullText" placeholder="Полный текст"></textarea>

  <button onclick="publishArticle()">
    Опубликовать
  </button>

  <div class="success" id="success"></div>
</div>

<script>
const DB = "https://upheld-chalice-468113-k6-default-rtdb.europe-west1.firebasedatabase.app/articles.json";

async function publishArticle(){

  const title = document.getElementById("title").value;
  const shortDesc = document.getElementById("shortDesc").value;
  const fullText = document.getElementById("fullText").value;

  if(!title || !shortDesc || !fullText){
    alert("Заполни все поля");
    return;
  }

  const article = {
    title,
    shortDesc,
    fullText,
    date:new Date().toLocaleString("ru-RU")
  };

  await fetch(DB,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify(article)
  });

  document.getElementById("success").innerText =
    "Статья опубликована";

  document.getElementById("title").value = "";
  document.getElementById("shortDesc").value = "";
  document.getElementById("fullText").value = "";
}
</script>

</body>
</html>
